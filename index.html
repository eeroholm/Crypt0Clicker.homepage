<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypt0Clicker3</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- pygbag CDN -->
    <script src="https://pygame-web.github.io/archives/0.9/pygbag.js"></script>
</head>

<body style="background: white; color: black; font-family: sans-serif;">
    <h2>    Crypt0 Clicker</h2>
    <p>Crypt0 Clicker is ad-free free-to-play-game without pay-to-win concept. You can play Crypt0 Clicker in your browser without loading it.</p>
    <script type="application/python" src="Crypt0Clicker3.py"></script>

    <script>
        window.addEventListener("load", () => {
            pygbag.run({
                program: "Crypt0Clicker3.py",
                canvas: null,
                args: []
            });
        });
    </script>
</body>
</html>
